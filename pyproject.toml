[project]
name = "legislint"
version = "0.1.0"
description = "Deterministic findings on congressional bill XML: cross-references, designators, dates, DTD conformance."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "lxml>=5.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[project.scripts]
legislint = "legislint.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/legislint"]

[tool.pytest.ini_options]
testpaths = ["tests"]
